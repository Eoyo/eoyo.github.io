<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 棋盘背景 -->
  <rect x="10" y="10" width="80" height="80" fill="#dcdcd0" />

  <!-- 棋盘线条 -->
  <g stroke="#666" stroke-width="1">
    <line x1="30" y1="10" x2="30" y2="90" />
    <line x1="50" y1="10" x2="50" y2="90" />
    <line x1="70" y1="10" x2="70" y2="90" />
    <line x1="10" y1="30" x2="90" y2="30" />
    <line x1="10" y1="50" x2="90" y2="50" />
    <line x1="10" y1="70" x2="90" y2="70" />
  </g>

  <!-- 棋子 -->
  <circle cx="30" cy="30" r="12" fill="#4d7" stroke="#fff" stroke-width="2" />
  <circle cx="50" cy="50" r="12" fill="#4d7" stroke="#fff" stroke-width="2" />
  <circle cx="70" cy="70" r="12" fill="#4d7" stroke="#fff" stroke-width="2" />
</svg>